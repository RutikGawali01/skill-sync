
spring:
  application:
    name: skill-sync-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT:2000}

server:
  port: ${PORT:8081}

jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: ${JWT_ACCESS_EXPIRATION}

google:
  client-id: ${GOOGLE_CLIENT_ID}

openrouter:
  api:
    key: ${OPENROUTER_API_KEY}

test:
  total-questions: 10
  duration-minutes: 15
  pass-percentage: 70
  retry-hours: 24

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, metrics

  endpoint:
    health:
      show-details: when-authorized
      show-components: always

    info:
      enabled: true

  info:
    env:
      enabled: false
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true

info:
  app:
    name: Skill-Sync Backend
    description: Real-time skill-exchange platform API
    version: 0.0.1-SNAPSHOT
    contact: rutik@skillsync.dev